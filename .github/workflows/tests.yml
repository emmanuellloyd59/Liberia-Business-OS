name: Tests
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: liberia_business_os
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d liberia_business_os"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile application and tests
        run: python -m compileall -q app tests wsgi.py
      - name: Verify migration on PostgreSQL 16
        run: python -m flask --app wsgi:app db upgrade
        env:
          SECRET_KEY: ci-only-test-secret
          FLASK_CONFIG: production
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/liberia_business_os
          RATELIMIT_STORAGE_URI: redis://localhost:6379/0
      - name: Run automated regression tests (isolated SQLite)
        run: python -m pytest -q
        env:
          SECRET_KEY: ci-only-test-secret
          FLASK_CONFIG: testing
      - name: Run application regression tests against PostgreSQL 16
        run: python -m pytest -q
        env:
          SECRET_KEY: ci-only-test-secret
          FLASK_CONFIG: testing
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/liberia_business_os
