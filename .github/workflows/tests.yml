name: Tests
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: liberia_business_os
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d liberia_business_os"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile application and tests
        run: python -m compileall -q app tests wsgi.py
      - name: Verify migration on PostgreSQL 16
        run: python -m flask --app wsgi:app db upgrade
        env:
          SECRET_KEY: ci-only-test-secret
          FLASK_CONFIG: production
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/liberia_business_os
          RATELIMIT_STORAGE_URI: redis://localhost:6379/0
      - name: Run automated regression tests (isolated SQLite)
        run: python -m pytest -q
        env:
          SECRET_KEY: ci-only-test-secret
          FLASK_CONFIG: testing
      - name: Run application regression tests against PostgreSQL 16
        run: python -m pytest -q
        env:
          SECRET_KEY: ci-only-test-secret
          FLASK_CONFIG: testing
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/liberia_business_os
      - name: Production smoke test for live registration page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PRODUCTION_URL: https://liberia-business-os.onrender.com
        run: |
          set -eu
          ready=0
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error "$PRODUCTION_URL/health" -o /tmp/health.json; then
              ready=1
              break
            fi
            echo "Production service not ready yet (attempt $attempt/24); retrying in 10 seconds."
            sleep 10
          done
          test "$ready" -eq 1
          python -c 'import json; d=json.load(open("/tmp/health.json")); assert d.get("status") == "ok", d'
          curl --fail --silent --show-error "$PRODUCTION_URL/auth/register" -o /tmp/register.html
          python - <<'PY'
          from pathlib import Path
          page = Path('/tmp/register.html').read_text()
          required = ('Create your account', 'name="csrf_token"', 'name="full_name"', 'name="email"', 'name="password"')
          missing = [item for item in required if item not in page]
          if missing:
              raise SystemExit(f'Live registration form missing expected fields: {missing}')
          print('Production smoke test passed: health check and registration form render correctly.')
          PY
          # A registration POST without its CSRF token must be rejected before
          # any account can be created. This intentionally submits no valid
          # registration data and does not mutate production records.
          status=$(curl --silent --show-error --output /tmp/register-csrf.html --write-out '%{http_code}' \
            --request POST \
            --data-urlencode 'full_name=Smoke Test Invalid' \
            --data-urlencode 'email=production-smoke-invalid@example.invalid' \
            --data-urlencode 'password=Not-a-real-production-password-123' \
            "$PRODUCTION_URL/auth/register")
          if [ "$status" != "400" ]; then
            echo "Expected CSRF-protected registration POST to return HTTP 400; got $status"
            exit 1
          fi
          echo "Production CSRF test passed: unauthenticated registration POST without token rejected with HTTP 400."
