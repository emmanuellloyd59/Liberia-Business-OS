services:
  - type: web
    name: liberia-business-os
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /health
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: liberia-business-os-db
          property: connectionString
      # Set this in Render to the private Redis URL of a shared Redis-compatible service.
      # Intentionally has no default: production startup fails closed without shared storage.
      - key: RATELIMIT_STORAGE_URI
        sync: false
databases:
  - name: liberia-business-os-db
    databaseName: liberia_business_os
    user: liberia_business_os
