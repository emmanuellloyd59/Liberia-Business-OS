services:
  - type: web
    name: liberia-business-os
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /health
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: liberia-business-os-db
          property: connectionString
databases:
  - name: liberia-business-os-db
    databaseName: liberia_business_os
    user: liberia_business_os
